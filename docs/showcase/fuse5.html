<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-->
<title>합성 v5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 카드 격자: 카드마다 실제 게임 캔버스 + 설명. 위에 목차·속도 막대 (sticky) */
:root { --bg:#f3f1ea; --card:#fffdf7; --fg:#26241e; --mute:#6d685b; --line:#ddd7c8; --accent:#b4432e; --stage:#0b0d14 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1c18; --card:#25261f; --fg:#ece8dc; --mute:#a7a291; --line:#3a3a31; --accent:#e0735c; --stage:#0b0d14; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#1b1c18; --card:#25261f; --fg:#ece8dc; --mute:#a7a291; --line:#3a3a31; --accent:#e0735c; --stage:#0b0d14; color-scheme:dark }
body { background:var(--bg); color:var(--fg); font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; margin:0 }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg) }
main { max-width:1200px; margin:0 auto; padding-block:24px 60px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)) }
h1 { font-size:24px; margin:0 0 4px; text-wrap:balance }
h2 { font-size:21px; margin:40px 0 4px; padding-top:8px; border-top:2px solid var(--line); scroll-margin-top:56px; text-wrap:balance }
.lead { color:var(--mute); margin:0 0 12px; max-width:75ch; font-size:14px }
.note { margin:0 0 12px; max-width:75ch; font-size:13.5px; border-left:3px solid var(--accent); padding:2px 0 2px 10px }
.top { position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); display:flex; gap:10px 18px; flex-wrap:wrap; align-items:center; padding:8px 0; border-bottom:1px solid var(--line) }
.top nav { display:flex; gap:16px; flex-wrap:wrap }
.top a { color:var(--fg); text-decoration:none; font-weight:600 }
.top a:hover, .top a:focus-visible { color:var(--accent) }
#speed { display:flex; gap:6px; align-items:center; margin-left:auto; flex-wrap:wrap }
#speed button { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:3px 10px; font:inherit; cursor:pointer }
#speed button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600 }
#speed button:focus-visible, .card canvas:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; margin-top:12px }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; min-width:0 }
.card canvas { width:100%; max-width:100%; aspect-ratio:360 / 640; border-radius:8px; display:block; background:var(--stage); cursor:pointer }
.card.wide { grid-column:1 / -1 }
.card.wide canvas { max-width:420px; margin:0 auto }
.card .stat { font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; margin-top:4px; text-align:center }
.card h4 { font-size:15px; margin:8px 0 2px }
.tag { display:inline-block; font-size:12px; color:var(--accent); border:1px solid currentColor; border-radius:999px; padding:0 8px; font-weight:500; vertical-align:2px }
.card p { margin:4px 0 0; color:var(--mute); font-size:13.5px }
.card p.weap { color:var(--fg); font-size:13px }
.card p.extra { font-size:12.5px }
.card p.code { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--mute); margin-top:6px; opacity:.85 }
.grid.compact { grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px }
.grid.compact .card { padding:8px }
.grid.compact .card h4 { font-size:14px }
.grid.compact .card p { font-size:12.5px }
.tablewrap { overflow-x:auto; margin-top:10px; border:1px solid var(--line); border-radius:10px; background:var(--card) }
table { border-collapse:collapse; font-size:13.5px; min-width:640px; width:100% }
th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top }
th { color:var(--mute); font-weight:600; font-size:12.5px; white-space:nowrap }
tr:last-child td { border-bottom:0 }
td:first-child { font-weight:600; white-space:nowrap }
.list { margin:10px 0 0; padding-left:20px; max-width:80ch; font-size:14px }
.list li { margin:2px 0 }
.chip { display:inline-block; font-size:12.5px; font-weight:700; color:var(--fg); border-left:4px solid var(--c); background:color-mix(in srgb, var(--c) 16%, var(--card)); border-radius:6px; padding:1px 7px; white-space:nowrap }
.linkgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px; margin-top:10px }
.linkcard { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--b); border-radius:10px; padding:10px 12px; min-width:0 }
.lhead { display:flex; flex-wrap:wrap; gap:6px; align-items:center }
.arrow { color:var(--mute); font-weight:700 }
.lname { margin-left:auto; color:var(--accent); font-size:14px }
.ltext { margin:6px 0 0; font-size:14px }
.lfx, .luse { margin:4px 0 0; font-size:12.5px; color:var(--mute) }
.matrixwrap { overflow-x:auto; margin-top:10px; border:1px solid var(--line); border-radius:10px; background:var(--card) }
table.matrix { border-collapse:separate; border-spacing:0; min-width:0; width:auto; font-size:12px }
table.matrix th, table.matrix td { padding:3px; border-bottom:0; text-align:center }
table.matrix .rowh { position:sticky; left:0; background:var(--card); text-align:left; z-index:1 }
table.matrix .colh .chip { writing-mode:vertical-rl; padding:6px 1px; border-left:0; border-top:4px solid var(--c) }
table.matrix .corner { color:var(--mute); font-weight:600 }
.cell.self { background:repeating-linear-gradient(45deg, transparent 0 4px, var(--line) 4px 5px) }
.dot { width:22px; height:22px; border-radius:6px; border:1.5px solid var(--b); background:transparent; cursor:pointer; padding:0; display:block; margin:auto }
.dot.named { background:color-mix(in srgb, var(--b) 55%, transparent) }
.dot.on { outline:2px solid var(--accent); outline-offset:1px }
.dot:focus-visible { outline:2px solid var(--accent); outline-offset:1px }
.detail { margin-top:10px }
details.group { margin-top:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); padding:8px 12px }
details.group summary { cursor:pointer; font-size:14px; color:var(--mute) }
details.group summary .chip { margin-right:4px }
details.group .linkgrid { margin-bottom:4px }
@media (max-width:560px) { .grid { grid-template-columns:1fr } .card canvas { max-width:380px; margin:0 auto } }
@media (max-width:560px) { .grid.compact { grid-template-columns:repeat(2, minmax(0, 1fr)) } .top { gap:6px 10px } .top nav { flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto; white-space:nowrap; min-width:0; scrollbar-width:none; padding-bottom:2px } }
</style>
<!--/PAGE-->
</head>

마다, 지속 절반, 삼각형이 클수록 짧게)"],"hand>trap":["철조망 긋기","두 곳을 이어 탭하면 그 사이에 함정 줄이 깔린다. 줄을 건너는 적은 묶이고 터진다 (줄 최대 셋, 함정 지속 그대로)"],"hand>air":["폭격 경로","연달아 탭한 자리들(최대 넷)을 이어, 마지막 탭 0.6초 뒤 폭격이 그 길을 따라 줄줄이 떨어진다 (공중 무기 그대로)"],"hand>charge":["돌격 길 긋기","두 곳을 이어 탭하면 첫 자리에서 둘째 자리 쪽으로 돌격이 달려 화면 끝까지 꿰뚫는다 (어느 방향이든)"],"hand>sound":["박자","탭할 때마다 손 자리에서 고리가 퍼진다. 0.4~0.8초 박자로 이어 치면 고리가 커진다 (박자마다 ×1.4, 최대 ×3, 박자가 깨지면 처음부터)"],"hand>spinner":["슬링","꾹 누르면 날이 손가락 둘레를 돌며 벤다 (누른 0.4초마다 하나, 최대 다섯). 떼면 날이 가장 많은 적 쪽으로 튀어나가 튕겨 다닌다"],"hand>field":["덧칠","연달아 탭한 자리들을 이어 장판 길이 그려진다 (마디 최대 넷, 장판 지속 그대로). 구역 모양을 내가 그린다"],"hand>ray":["광선 벽","두 곳을 이어 탭하면 그 사이에 광선 벽이 3초 선다. 벽에 걸친 적은 오래 걸쳐 있을수록 세게 지져진다 (최대 ×4)"],"hand>throw":["튕김 경로","탭한 순서대로 튕긴다: 지난 탭 자리에서 지금 탭 자리로 투척물이 날아가며 사이 적을 치고, 탭을 이어 갈수록 튕김이 이어지며 세진다 (이을 때마다 ×1.2)"],"hand>swarm":["벌집 두드리기","탭한 자리에 작은 떼가 깨어나고, 같은 곳(반경 60)을 이어 칠수록 한 구름으로 뭉쳐 커진다 (탭마다 +30%, 최대 ×3, 3초 유지)"],"hand>spirit":["혼 빙의","탭할 때마다 탭한 자리 둘레에서 최근 죽은 적의 혼(최대 다섯)이 일어나 혼탄으로 가까운 적을 쏜다. 많이 죽은 자리일수록 세다"],"gun>hand":["모아 쏘기","총이 탄을 모아 둔다 (그동안 절반만 쏘고 나머지는 쌓음, 최대 서른 발). 탭하면 모은 탄을 탭한 곳으로 한꺼번에 쏟아붓는다 (모은 탄 ×1.5)"],"gun>turret":["유탄","총탄이 맞은 자리가 터진다 (반경 45, 포격 피해에 총탄 세기 비례). 한 발 한 발이 범위 공격"],"gun>summon":["전향탄","총으로 쓰러뜨린 적이 아군으로 일어나 아직 아무도 안 맡은 적을 맡는다 (6초, 동시 여덟). 아군이 쓰러뜨린 적도 또 일어난다"],"gun>magic":["주문탄","다섯 발째마다 주문탄: 맞은 적에게 그 주문 (지속 = 다섯 발 피해에 비례). 분신이면 맞힐 때마다 분신 시간이 쌓여 총이 두 줄로 쏜다"],"gun>trap":["불발 지뢰","빗나간 총탄이 바닥에 박혀 지뢰가 된다 (함정 피해, 8초, 화면 최대 스물). 쏠수록 앞줄이 지뢰밭"],"gun>air":["곡사","총탄이 하늘로 솟았다 표적 위로 내리꽂힌다: 앞줄에 막히지 않고 뒷줄을 노리고, 떨어진 자리가 터진다 (반경 30, 그림자 예고)"],"gun>charge":["관통 가속","총탄이 모든 적을 꿰뚫고, 꿰뚫을 때마다 빨라지고 세진다 (한 명마다 +25%). 줄 선 적일수록 세다"],"gun>sound":["총구 충격파","쏠 때마다 총구 앞 부채꼴로 충격파가 나가 가까이 온 적을 밀어내고 0.3초 멈칫하게 한다"],"gun>spinner":["부메랑 탄","총탄이 끝까지 날아간 뒤 돌아오며 다시 맞히고, 돌아온 탄은 총 둘레를 1초 돌며 가까이 온 적을 벤다"],"gun>field":["불길 탄도","총탄이 지나간 줄에 장판이 1.5초 남는다 (그 장판 그대로: 불·독·얼음·끌어당김). 쏠수록 앞이 불바다"],"gun>ray":["집중 사격","같은 적을 계속 맞힐수록 탄이 굵어진다 (연속 명중마다 +15%, 최대 ×3). 표적이 바뀌면 처음부터"],"gun>throw":["도탄","총탄이 맞고 가까운 다른 적으로 튕긴다 (두 번, 85%씩). 한 발이 세 적"],"gun>swarm":["벌레탄","총탄이 맞은 적에 벌레로 붙어 1.5초 갉는다 (느림, 받는 피해 ×1.5). 쓰러지면 벌레가 옆 적으로 옮겨 붙는다"],"gun>spirit":["혼 탄창","총으로 쓰러뜨린 적의 혼이 탄창에 들어와 유도 혼탄이 된다 (혼 하나 = 혼탄 셋, 다음 사격에 섞여 나감). 잡을수록 탄이 불어난다"],"turret>hand":["지정 포격","탭한 곳이 포격 표적이 된다: 3초 동안 모든 포탄이 탭한 곳으로 (가까워도 친다), 탭할 때마다 포탄 한 발이 바로 날아간다"],"turret>gun":["공중 산탄","포탄이 떨어지기 직전 공중에서 터져 아래로 총탄 열두 발을 뿌린다 (그 총 성질). 무리 전체에 탄 비"],"turret>summon":["강하 포드","포탄 대신 소환수 셋을 담은 포드가 떨어진다. 뒷줄 한복판에서 뛰쳐나와 각자 다른 적을 맡는다"],"turret>magic":["주문 포탄","포탄이 터진 자리 전체(반경 ×1.5)에 그 주문. 멈춤이면 뒷줄 무리가 통째로 멈춘다 (지속 = 포탄 피해 비례)"],"turret>trap":["살포탄","포탄이 터지며 둘레에 함정 다섯이 고리 모양으로 흩뿌려진다. 뒷줄이 걸어올 길이 지뢰밭"],"turret>air":["궤도 유도","포탄이 떨어진 자리에 표식이 남고, 1초 뒤 하늘에서 그 공중 무기가 표식에 떨어진다 (공중 쿨다운과 따로, 표식마다)"],"turret>charge":["굴림탄","떨어진 포탄이 멈추지 않고 방어선 쪽으로 굴러 한 줄을 뭉갠다 (굴러가는 동안 계속 피해). 뒷줄부터 앞줄까지"],"turret>sound":["충격탄","착탄 충격파가 크게 퍼져(반경 ×2) 무리를 뒤로 밀어내고 0.6초 멈칫하게 한다. 무리 전체를 늦춘다"],"turret>spinner":["파편 원반","포탄이 터지며 날 넷이 튀어나와 4초 튕겨 다닌다"],"turret>field":["분화구","포탄 자국이 장판으로 남는다 (반경 ×1.2, 장판 지속 그대로). 무리가 지나는 자리를 계속 지진다"],"turret>ray":["착탄 사슬","최근 떨어진 포탄 세 자리가 전기줄로 이어져, 줄 위를 지나는 적을 지진다 (오래 이어질수록 세짐)"],"turret>throw":["도약탄","포탄이 터진 뒤 튀어 올라 가까운 다음 무리에 한 번, 또 한 번 더 떨어진다 (세 번, 80%씩)"],"turret>swarm":["벌집탄","포탄이 터지며 떼가 쏟아져 무리를 3초 덮는다 (약화). 뒷줄 전체가 받는 피해 ×1.5"],"turret>spirit":["혼 포탄","포탄으로 쓰러뜨린 적의 혼이 다음 포탄에 실린다: 혼 하나마다 포탄이 커진다 (반경 +10%, 최대 ×2)"],"summon>hand":["지휘","탭하면 소환수가 모두 탭한 곳 둘레 적으로 몰려가고, 거기 닿은 소환수는 3초 동안 피해 ×2"],"summon>gun":["무장 소환수","소환수마다 총을 들고 맡은 적 곁에서 쏜다 (총 쿨다운마다, 그 총 성질). 총이 소환수 수만큼"],"summon>turret":["포병 소환수","소환수가 포를 업고 다니며 맡은 적 둘레 무리에 포탄을 쏜다 (가까워도 친다)"],"summon>magic":["주술사","소환수마다 맡은 적 둘레에 그 주문 (주문 쿨다운 절반마다). 분신이면 소환수가 둘로 갈라지고, 가속이면 소환수가 두 배로 빨리 싸운다"],"summon>trap":["공병","소환수가 맡은 적 앞에 함정을 깔고 싸운다 (함정 쿨다운마다). 싸우는 곳마다 함정"],"summon>air":["강하병","소환수가 걸어 나가지 않고 하늘에서 맡은 적 바로 위로 내리꽂히며 나온다 (착지 = 공중 피해·반경). 나오는 순간이 폭격"],"summon>charge":["돌격대","소환수가 맡은 적을 향해 일직선으로 돌진해 사이 적을 꿰뚫고 부딪친 뒤 그 적과 싸운다"],"summon>sound":["포효","소환수가 적에 닿을 때마다 포효: 둘레 적이 밀리고 0.4초 멈칫. 소환수가 붙잡는 힘이 커진다"],"summon>spinner":["칼날 호위","소환수 둘레를 날 둘이 돌며 닿는 적을 벤다. 몸마다 날 둘"],"summon>field":["발자국","소환수 발밑에 장판이 따라다닌다. 소환수가 싸우는 곳이 구역"],"summon>ray":["사슬 진형","소환수끼리 줄로 이어져, 줄 사이를 지나는 적을 지진다 (붙어 있을수록 세짐). 소환수 수만큼 울타리"],"summon>throw":["도약 소환수","소환수가 맡은 적을 쓰러뜨리면 가까운 다음 적에게 뛰어 덮친다 (착지 피해, 수명 +2초). 쉬지 않고 옮겨 다닌다"],"summon>swarm":["숙주 소환수","소환수에게 맞은 적이 약해지고, 소환수가 쓰러질 때 떼로 흩어져 둘레를 3초 덮는다. 죽어도 끝이 아니다"],"summon>spirit":["혼 먹는 짐승","소환수가 적을 쓰러뜨릴 때마다 커진다 (처치마다 피해·크기 +20%). 다섯을 쓰러뜨리면 거대해져 수명이 다시 찬다"],"magic>hand":["손 시전","주문이 저절로 나가지 않고 다 차면 손에 쥐어진다. 탭한 곳에 걸면 반경 ×1.5, 지속 ×1.5"],"magic>gun":["주문 탄막","주문이 발동한 마법진이 6초 동안 사방으로 총탄을 쏟는다 (그 총 연사 속도, 주문에 걸린 적부터 노림)"],"magic>turret":["주문 포격","주문에 걸린 적마다 머리 위로 포탄이 떨어진다. 걸린 적이 많을수록 포탄 폭우"],"magic>summon":["소환진","마법진에서 주문에 걸린 적 수만큼(최대 여섯) 소환수가 쏟아져 나와 걸린 적을 하나씩 맡는다"],"magic>trap":["주문 덫","주문에 걸린 적 발밑마다 함정이 꽂힌다. 멈추거나 느려진 적은 피하지 못하고 바로 터진다"],"magic>air":["하늘 문","마법진 위로 하늘이 열려 4초 동안 그 공중 무기가 마법진 안으로 쏟아진다 (걸린 적부터 노림)"],"magic>charge":["질주 주문","주문이 발동하면 마법진을 지나는 돌격 넷이 서로 다른 방향으로 꿰뚫는다 (걸린 적을 잇는 줄로)"],"magic>sound":["주문 메아리","주문이 고리처럼 퍼진다: 마법진에서 퍼지는 고리(반경 ×2)에 닿는 적 모두에게 그 주문 (짧게)"],"magic>spinner":["구르는 마법진","마법진이 날이 되어 4초 굴러다니며 닿는 적에게 그 주문을 건다 (짧게)"],"magic>field":["저주 자국","주문에 걸린 적 발밑에 장판이 따라다닌다. 걸린 적이 무리 사이를 지나며 둘레에 장판을 흘린다"],"magic>ray":["주문 사슬","주문에 걸린 적끼리 줄로 이어진다. 한 적이 받은 피해의 30% 가 사슬의 다른 적에게도"],"magic>throw":["옮는 주문","주문에 걸린 적이 쓰러지면 투척물이 튀어 가까운 다음 적을 치고 주문이 옮는다 (세 번까지)"],"magic>swarm":["저주 떼","주문에 걸린 적 둘레로 떼가 퍼져 주문이 끝날 때까지 덮는다 (약화). 걸린 무리 전체가 받는 피해 ×1.5"],"magic>spirit":["혼 의식","주문에 걸린 채 쓰러진 적은 혼 셋을 남긴다: 주문 쿨다운이 3초 줄고, 그 자리에 작은 정령이 떠서 쏜다. 잡을수록 주문이 자주"],"trap>hand":["원격 기폭","탭하면 탭한 곳 둘레(반경 120) 함정이 밟히지 않아도 한꺼번에 터진다. 터진 함정은 2초 뒤 그 자리에 다시 선다"],"trap>gun":["산탄 지뢰","함정이 터질 때 그 자리에서 전방향으로 총탄 열두 발이 퍼진다 (그 총 성질 그대로). 함정 + (총 + 소환수) 면 그 총탄에 쓰러진 적도 아군으로 일어난다"],"trap>turret":["연쇄 포대","함정이 밟히면 그 길목 뒤쪽 무리로 포탄 셋이 날아간다. 한 놈이 밟으면 뒤따라오던 무리까지"],"trap>summon":["포획","함정에 걸린 적(보스 빼고)을 거두고 그 자리에 아군으로 세운다 (8초, 동시 여덟). 적이 줄고 아군이 는다"],"trap>magic":["덫 주문","함정이 밟히면 둘레(반경 90)에 그 주문 (지속 = 함정 피해 비례). 멈춘 적은 다음 함정까지 피하지 못한다"],"trap>air":["표식 함정","함정이 밟히면 그 자리가 하늘의 표식이 되어 그 공중 무기가 셋 떨어진다"],"trap>charge":["도화선","함정이 밟히면 그 줄을 따라 돌격이 좌우로 튀어나가 한 줄을 꿰뚫는다"],"trap>sound":["경보","함정이 터질 때 경보 고리(반경 140)가 둘레 적을 가장 가까운 다른 함정 쪽으로 밀어붙인다. 함정끼리 연쇄"],"trap>spinner":["톱날 덫","함정이 터지면 날이 튀어나와 그 자리를 4초 돌며 지킨다 (다음에 오는 적도 벤다)"],"trap>field":["늪 덫","함정이 깔리는 순간부터 둘레가 장판이다 (반경 ×1.5). 밟혀 터지면 장판이 두 배로 커진다. 기다리는 동안도 일한다"],"trap>ray":["인계철선","가까운 함정끼리(150 안) 줄로 이어진다. 줄을 건너는 적이 걸리면 이어진 함정이 전부 터진다"],"trap>throw":["도약 지뢰","함정이 터진 뒤 튀어 가까운 다음 적 발밑으로 옮겨 가 다시 꽂힌다 (세 번까지). 함정 하나가 세 번"],"trap>swarm":["벌집 덫","함정이 밟히면 떼가 터져 나와 3초 둘레를 덮는다 (약화)"],"trap>spirit":["영혼 덫","함정에서 죽은 적의 혼이 그 함정에 들어간다: 혼 하나마다 함정이 커지고 (반경 +15%) 한 번 더 터진다"],"air>hand":["그림자 끌기","그림자가 진 동안 탭하면 그림자가 탭한 곳으로 옮겨 가고, 옮긴 낙하는 ×1.5. 떨어질 곳을 마지막에 내가 고친다"],"air>gun":["기총 소사","떨어지는 동안 아래로 총탄을 난사한다 (떨어지는 1초 동안 그 총 속도 ×2). 떨어지기 전부터 공격"],"air>turret":["집속 낙하","떨어진 것이 포탄 셋으로 갈라져 근처 무리로 다시 날아간다"],"air>summon":["낙하산 부대","떨어지는 것마다 소환수가 타고 내려와, 착지한 자리 적을 맡는다. 적 한가운데로 바로"],"air>magic":["하늘 낙인","그림자가 드리우는 순간부터 그림자 안 적은 그 주문에 걸린다 (멈춤이면 피하지 못하고 맞는다). 예고가 곧 주문"],"air>trap":["공중 살포","떨어진 자리에 함정 셋이 고리로 꽂힌다. 흩어진 자리마다 지뢰밭"],"air>charge":["급강하","비스듬히 내리꽂혀 땅에 닿은 뒤 그 방향으로 미끄러지며 한 줄을 뭉갠다"],"air>sound":["충격 낙하","떨어질 때 충격파(반경 ×2)가 퍼져 둘레를 밀어내고 0.6초 멈칫하게 한다"],"air>spinner":["통통 낙하","떨어진 것이 바닥에 튕겨 세 번 더 통통 굴러다니며 터진다"],"air>field":["그림자 장판","그림자 자체가 장판이다: 떨어지기 전 그림자 위 적이 지져지고, 떨어진 뒤 그 자리에 장판이 남는다"],"air>ray":["궤도 기둥","떨어진 자리에서 하늘로 빛기둥이 3초 서고, 기둥끼리 줄로 이어져 사이를 지난 적을 지진다"],"air>throw":["되튀는 폭격","떨어진 것이 터진 뒤 튕겨 가까운 다음 적 위로 다시 떨어진다 (세 번)"],"air>swarm":["벌집 투하","떨어진 자리에서 떼가 퍼져 3초 덮는다 (약화)"],"air>spirit":["혼 운석","공중으로 쓰러뜨린 적의 혼이 하늘에 모여, 열 개마다 거대한 혼 운석 하나가 가장 몰린 곳에 떨어진다"],"charge>hand":["핸들","달리는 돌격을 탭한 쪽으로 꺾는다 (돌격마다 두 번까지, 꺾을 때마다 +20%)"],"charge>gun":["기총 차량","달리면서 양옆으로 총탄을 난사한다 (그 총 속도로, 그 총 성질). 한 줄 + 양옆"],"charge>turret":["자주포","달리는 동안 80마다 멈춰 선 무리를 향해 포탄을 쏜다 (가까워도 친다)"],"charge>summon":["수송대","달리면서 80마다 소환수를 내려놓는다 (각자 다른 적을 맡음)"],"charge>magic":["주문 행렬","돌격이 지나간 줄 전체에 그 주문 (짧게, 지속 = 돌격 피해 비례). 분신이면 돌격이 한 줄 더 따라 달린다"],"charge>trap":["지뢰 부설","지나간 줄에 함정이 줄지어 깔린다 (80마다 하나)"],"charge>air":["공중 엄호","달리는 돌격 머리 위로 폭격이 따라오며 지나간 자리에 떨어진다"],"charge>sound":["음속 돌파","달리며 소닉붐: 지나간 줄 양옆 적을 밀어내고 0.4초 멈칫하게 한다"],"charge>spinner":["칼날 전차","돌격 둘레를 날 둘이 돌며 양옆을 벤다. 다 달리면 날이 흩어져 3초 더 튕긴다"],"charge>field":["불 자국 질주","지나간 길을 따라 장판이 줄줄이 깔려 한 줄이 통째로 구역이 된다 (장판 지속 그대로)"],"charge>ray":["견인 광선","달리는 동안 옆 적들에게 줄기를 걸어 끌고 간다. 끌려간 적끼리 부딪쳐 피해"],"charge>throw":["핀볼","화면 끝에 닿아도 사라지지 않고 튕겨 다른 각도로 다시 달린다 (두 번 더)"],"charge>swarm":["역병 행렬","구름을 끌고 달려 지나간 줄 전체를 덮는다 (약화 2초)"],"charge>spirit":["혼 수레","들이받아 쓰러뜨릴 때마다 빨라지고 커진다 (처치마다 +10%). 다섯을 쓰러뜨리면 한 번 더 달린다"],"sound>hand":["붙잡은 고리","꾹 누르면 다음 고리를 붙잡아 키운다 (누른 시간만큼 반경·밀치기 최대 ×3). 떼는 순간 퍼진다"],"sound>gun":["탄막 고리","고리가 총탄 고리가 된다: 퍼질 때 사방으로 총탄 스물넷 (그 총 성질)"],"sound>turret":["공명 포격","고리가 퍼질 때마다 가장 몰린 무리 셋 위로 포탄이 떨어진다 (고리가 닿지 않는 먼 무리까지)"],"sound>summon":["징집 나팔","고리가 퍼질 때 맞은 적 수만큼(최대 넷) 소환수가 고리 끝에서 뛰쳐나가 그 적들을 하나씩 맡는다"],"sound>magic":["주문 울림","고리에 맞은 적 모두에게 그 주문 (짧게, 지속 = 고리 피해 비례). 멈춤이면 고리가 곧 정지파"],"sound>trap":["몰이 고리","고리가 적을 가장 가까운 함정 쪽으로 밀고, 고리가 처음 닿은 적 둘 발밑에 함정이 꽂힌다"],"sound>air":["공명 낙하","고리에 맞은 적 중 셋 위로 하나씩 떨어진다"],"sound>charge":["충격 돌파","고리가 맞은 적을 멀리 날려 보내고, 날아간 적이 뒤 적들과 부딪친다 (부딪친 적도 피해)"],"sound>spinner":["회전 고리","고리가 톱날 고리가 되어 퍼진 뒤 2초 동안 그 자리에서 돌며 벤다"],"sound>field":["파문","고리가 지나간 자리에 고리 모양 장판이 2초 남는다 (그 장판 그대로)"],"sound>ray":["공명 사슬","음파 자리에서 고리에 맞은 적들을 차례로 줄로 이어 2초 함께 지진다 (많이 맞을수록 줄이 길다)"],"sound>throw":["메아리","고리에 맞은 적에서 작은 고리가 한 번 더 퍼진다 (60%). 몰린 무리일수록 겹겹이"],"sound>swarm":["떼 고리","고리를 따라 떼가 퍼져 고리 끝에 구름 고리로 2초 남는다 (지나가는 적 약화)"],"sound>spirit":["혼 울림","고리로 쓰러뜨린 적의 혼이 다음 고리를 키운다 (혼 하나마다 반경·피해 +8%, 최대 ×2)"],"spinner>hand":["불러 모으기","탭하면 떠 있던 날이 모두 탭한 곳으로 모여들며 지나는 적을 베고, 그 둘레를 1초 돈 뒤 다시 퍼진다"],"spinner>gun":["회전 포탑","날이 돌면서 사방으로 총탄을 뿌린다 (그 총 속도의 절반, 그 총 성질)"],"spinner>turret":["폭탄 원반","날이 튕길 때마다 터진다 (반경 35), 수명이 끝날 때 크게 터진다"],"spinner>summon":["사냥매","날이 아직 아무도 안 맡은 적을 쫓아 튕기고, 수명이 다하면 그 자리에 짐승으로 내려앉아 싸운다"],"spinner>magic":["주문 궤적","날이 지나간 자리가 1초 동안 주문 선이 된다. 선을 건넌 적에게 그 주문"],"spinner>trap":["꽂히는 날","날 수명이 끝나면 바닥에 꽂혀 함정이 된다. 밟히면 터지며 날이 다시 튀어 3초 돈다"],"spinner>air":["급강하 날","날이 벽에 튕길 때마다 높이 솟았다가 가장 몰린 곳에 내리꽂힌다 (그림자 예고)"],"spinner>charge":["왕복 날","날이 가장 몰린 줄을 화면 끝에서 끝까지 일직선으로 꿰뚫고, 벽에서 돌아와 다시 꿰뚫는다 (왕복)"],"spinner>sound":["윙윙","날 둘레가 울려 날이 지나간 자리 적이 밀리고 0.2초 멈칫한다"],"spinner>field":["궤적 장판","날이 지나간 궤적이 1.5초 장판으로 남는다"],"spinner>ray":["볼라","날이 둘씩 줄로 이어져 함께 돈다. 줄 사이에 걸린 적을 지진다"],"spinner>throw":["분열 날","날이 적을 벨 때마다 작은 날 하나가 갈라져 나온다 (날 하나에 최대 넷)"],"spinner>swarm":["벌떼 날","날 뒤로 떼가 따라다니며 날이 벤 적을 덮는다 (약화)"],"spinner>spirit":["영혼 날","날로 쓰러뜨릴 때마다 날이 하나 늘어난다 (최대 여섯, 날 수명 동안)"],"field>hand":["장판 옮기기","탭하면 가장 가까운 장판이 탭한 곳으로 미끄러져 가며 지나간 길도 지진다"],"field>gun":["포탑 바닥","장판 위 적마다 1초에 한 번 바닥에서 총탄 셋이 솟아 그 적과 둘레 적을 쏜다"],"field>turret":["폭발 바닥","장판이 깔릴 때 그 한가운데로 포탄이 떨어지고, 그 뒤로 장판 위 적 발밑이 1초마다 터진다 (넷까지, 반경 30)"],"field>summon":["둥지 바닥","장판이 깔려 있는 동안 1.5초마다 장판 한가운데서 소환수가 하나씩 깨어나 장판 위 적을 맡는다"],"field>magic":["주문진 장판","장판 위 적에게 1초마다 그 주문 (짧게). 장판이 곧 멈춤·변이 구역"],"field>trap":["가시 테두리","장판 테두리를 따라 함정이 깔려, 장판에서 나가려는 적이 걸린다. 장판이 가두는 우리"],"field>air":["착륙장","장판 위로 하늘에서 1초마다 하나씩 떨어진다 (장판 위 적을 노림)"],"field>charge":["밀어내는 바닥","장판 위 적이 1초마다 장판 밖으로 튕겨 나가며 뒤 적들과 부딪친다. 몰려오는 적을 막는 벽"],"field>sound":["맥동","장판이 1초마다 울려 가장자리 적을 안쪽으로 밀어 넣는다. 들어온 적이 나가지 못한다"],"field>spinner":["구르는 장판","장판이 천천히 구르며 화면을 튕겨 다닌다 (지속 ×1.5). 무리를 찾아 굴러간다"],"field>ray":["장판 회로","장판끼리 줄로 이어져, 줄 위 적도 장판처럼 지진다"],"field>throw":["번지는 장판","장판 위에서 쓰러진 적 자리로 작은 장판이 옮겨 번진다 (세 번까지)"],"field>swarm":["독충 바닥","장판 위 적이 약해진다 (느림·받는 피해 ×1.5). 장판 위 적에게 다른 무기도 ×1.5"],"field>spirit":["혼 웅덩이","장판 위에서 죽은 적마다 장판이 넓어지고 오래 간다 (+15%씩)"],"ray>hand":["표적 고정","탭한 적에 모든 줄기가 옮겨 붙고 배율을 잃지 않는다. 그 적이 쓰러지면 가까운 적으로 배율째 옮긴다"],"ray>gun":["분광","줄기가 붙은 적에게서 0.5초마다 총탄 셋이 옆 적들로 갈라져 나간다 (줄기 배율만큼 세게)"],"ray>turret":["과부하","배율이 ×4 에 닿거나, ×1.5 넘게 붙어 있던 적이 쓰러지면 과부하로 크게 터진다 (반경 70, 포격 피해 × 배율). 줄기는 다음 적으로"],"ray>summon":["조종 광선","배율 ×1.5 부터 줄기가 붙은 적을 조종한다: 그 적이 2초 동안 아군처럼 옆 적을 치고, 끝나면 쓰러진다"],"ray>magic":["주문 집속","배율 ×1.5 부터 줄기가 붙은 적에게 그 주문이 붙어 있는 동안 계속 걸린다. 멈춤이면 꼼짝 못 하고 녹는다"],"ray>trap":["낙인","줄기가 붙었던 적이 쓰러지면 그 자리에 배율만큼 센 함정이 남는다"],"ray>air":["궤도 조준","줄기가 붙은 적은 하늘에서도 조준된다: 배율이 0.5 오를 때마다 (×1.5·×2·…) 그 적 위로 하나가 떨어진다"],"ray>charge":["관통 광선","줄기가 붙은 적 뒤로 화면 끝까지 뻗어 그 줄의 적을 모두 같은 배율로 지진다"],"ray>sound":["진동파","줄기가 붙은 적이 떨려, 둘레 적이 0.5초마다 밀리고 멈칫한다 (반경 50 × 배율/2)"],"ray>spinner":["회전 광선","줄기 끝에서 짧은 빛날이 돌며 붙은 적 둘레를 벤다 (배율만큼 빠르게)"],"ray>field":["녹는 바닥","줄기가 붙은 적 발밑이 장판이 된다 (배율만큼 넓게)"],"ray>throw":["도약 광선","붙은 적이 쓰러지면 줄기가 끊기지 않고 가까운 다음 적으로 배율째 옮겨 붙는다 (세 번까지)"],"ray>swarm":["줄기 포자","배율이 오를 때마다 붙은 적 둘레로 떼가 퍼진다 (약화). 약해진 적이 더 빨리 녹는다"],"ray>spirit":["혼 증폭","줄기로 쓰러뜨린 적의 혼이 줄기에 남아, 다음 적을 높은 배율에서 시작한다 (혼 하나마다 +0.5, 최대 ×3)"],"throw>hand":["꺾기","탭하면 날아가던 투척물이 모두 탭한 곳으로 방향을 꺾는다. 꺾인 투척물은 튕김 +1"],"throw>gun":["파편 수류탄","튕길 때마다 사방으로 총탄 여섯이 터져 나간다 (그 총 성질)"],"throw>turret":["집속탄","튕길 때마다 작게 터지고, 마지막 튕김에서 크게 터진다 (반경 ×2, 포격 피해)"],"throw>summon":["짐승 던지기","마지막으로 떨어진 자리에서 튕긴 수만큼(최대 셋) 소환수가 일어나 싸운다"],"throw>magic":["주문 폭발","튕길 때마다 주문이 모이고, 마지막 튕김 자리에서 반경 90 에 터져 걸린다 (튕긴 수만큼 길게)"],"throw>trap":["통통 지뢰","튕길 때마다 그 자리에 함정이 꽂힌다. 흩어진 적 사이에 지뢰가 흩뿌려진다"],"throw>air":["높이 던지기","첫 투척을 하늘 높이 던져 그림자 예고 뒤 내리꽂고 (공중 피해·반경), 거기서부터 튕기기 시작한다"],"throw>charge":["굴리기","던진 것이 튕기지 않고 굴러가며 한 줄을 꿰뚫고, 적에 닿을 때마다 커진다"],"throw>sound":["충격 투척","튕길 때마다 작은 충격파 (반경 50, 밀치기·멈칫 0.3초)"],"throw>spinner":["부메랑","마지막 튕김 뒤 처음 자리로 돌아오며 다시 베고, 돌아오면 한 번 더 던진다"],"throw>field":["독병","튕긴 자리마다 장판이 2초 남는다"],"throw>ray":["사슬 투척","튕긴 자리끼리 빛 사슬로 이어져 2초 지진다. 튕긴 경로가 그대로 사슬"],"throw>swarm":["벌집 투척","맞은 적에 떼가 붙고 (약화), 그 적이 쓰러지면 떼가 다음 적으로 옮는다"],"throw>spirit":["혼 튕김","쓰러뜨릴 때마다 튕김 +1 (잡는 한 계속 이어짐, 최대 열)"],"swarm>hand":["떼 부르기","꾹 누르면 화면의 구름이 모두 손가락으로 모여들고, 떼면 그 자리에서 크게 퍼진다 (반경 ×2, 2초)"],"swarm>gun":["무장 떼","구름 속 하나하나가 쏜다: 덮은 적마다 1초에 총탄 셋 (그 총 성질)"],"swarm>turret":["자폭 떼","구름이 사라질 때 덮은 자리 전체가 터진다 (반경 = 구름, 덮은 적이 많을수록 세게)"],"swarm>summon":["떼 군단","구름에서 소환수가 하나씩 떨어져 나와 덮인 적을 맡는다 (구름이 클수록 자주)"],"swarm>magic":["역병 주문","덮인 적에게 1초마다 그 주문 (짧게). 덮인 적이 많을수록 구름이 퍼진다"],"swarm>trap":["알 낳기","구름이 지나간 자리에 알(함정)이 남는다. 밟히면 떼가 새로 깨어난다 (작은 구름 2초)"],"swarm>air":["떼 강하","구름이 4초마다 위로 솟았다 가장 몰린 무리에 내리꽂히며 덮는다 (공중 피해, 그림자 예고)"],"swarm>charge":["행군","구름이 가장 몰린 줄을 화면 끝에서 끝까지 오가며 덮고, 지나가는 적을 들이받는다"],"swarm>sound":["날갯짓","구름이 1초마다 웅웅 울려 덮은 적을 구름 한가운데로 끌어모은다. 빠져나가지 못한다"],"swarm>spinner":["소용돌이 떼","구름이 소용돌이로 돌며 덮은 적을 둘레로 끌고 다닌다 (베는 피해)"],"swarm>field":["독충 둥지","구름이 머문 자리에 장판이 2초 남는다"],"swarm>ray":["약점 표적","구름이 덮은 적들끼리 줄로 이어져 1초마다 함께 지져진다. 덮인 적이 많을수록 줄도 많다"],"swarm>throw":["번식","덮인 적이 쓰러지면 떼가 다음 무리로 옮겨 붙으며 둘로 갈라진다 (최대 넷)"],"swarm>spirit":["포식","덮인 채 죽은 적마다 구름이 불어난다 (반경 +10%, 수명 +1초, 최대 ×2)"],"spirit>hand":["수동 기폭","탭하면 정령이 탭한 곳으로 날아가 모은 혼만큼 그 자리에서 터진다 (다섯 이상이면, 혼 하나마다 혼탄 둘)"],"spirit>gun":["혼 연사","혼이 모일수록 정령이 빨리 쏜다 (혼 하나마다 +10%). 터질 때 혼탄 대신 그 총 탄 서른둘"],"spirit>turret":["혼 포격","정령이 혼을 다 모으면 터지는 대신 가장 몰린 무리 셋에 혼 포탄을 쏜다"],"spirit>summon":["혼의 군세","정령이 터질 때 혼탄이 맞은 자리마다 소환수가 일어나 각자 적을 맡는다"],"spirit>magic":["혼 주문","정령이 터질 때 화면 전체 적에게 그 주문 (짧게)"],"spirit>trap":["혼 지뢰","처치한 자리에 혼이 함정으로 남는다. 정령이 터질 때 화면의 혼 함정이 모두 함께 터진다"],"spirit>air":["혼별","정령이 터질 때 혼탄 대신 혼별 열여섯이 하늘에서 몰린 곳들에 떨어진다"],"spirit>charge":["혼 돌진","정령이 혼을 다 모으면 직접 화면을 가로질러 돌진하며 꿰뚫고 돌아온다"],"spirit>sound":["혼 공명","혼이 정령에게 들어갈 때마다 정령 둘레로 작은 고리, 터질 때는 큰 충격파"],"spirit>spinner":["혼 원반","혼 다섯마다 정령 둘레에 날 하나가 생겨 돈다 (최대 넷). 터질 때 날이 사방으로 흩어진다"],"spirit>field":["혼불 자리","정령이 터진 자리 둘레(반경 140)가 장판으로 4초 남는다"],"spirit>ray":["혼 줄기","정령과 가장 단단한 적이 줄기로 이어진다. 혼이 쌓일수록 세진다 (×1 ~ ×4)"],"spirit>throw":["혼탄 도약","터질 때 혼탄이 맞은 적에서 튕겨 두 번 더 맞힌다"],"spirit>swarm":["혼 떼","혼이 정령에게 가는 길에 떼가 되어 지나는 적을 덮는다 (약화)"]},W={goal:1.3,kMin:.5,kMax:2,bonusDmg:1.6,bonusCd:.7,verbMul:1.8,guardRange:150,guardCd:2.5,bonusA:{trap:1.6,magic:1.5,field:1.4,sound:1.3},allySec:4,unitDmg:.75,unitCap:6,spiritBurst:8,allyCap:5,maxDepth:2},Fr=ae;function Kr(){let i=[];for(let e of Fr)for(let t of Fr){if(e===t)continue;let r=`${e}>${t}`,s=Vs[r];if(!s)throw new Error(`v2 규칙 없음: ${r}`);i.push({key:r,from:e,to:t,title:`${J[e]} + ${J[t]}`,name:s[0],text:
