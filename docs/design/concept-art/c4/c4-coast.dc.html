.co-b1{animation:coBlink 1.6s steps(1) infinite}
.co-b2{animation:coBlink2 1.6s steps(1) infinite}
.co-swell{animation:coSwell 3.2s ease-in-out infinite}

.co-btn{position:absolute;bottom:5px;height:24px;padding:0 14px;border:1px solid rgba(255,196,130,.55);border-radius:12px;background:#232638;color:#FFF1E0;font:800 12px/22px 'Nanum Gothic',sans-serif;letter-spacing:.04em;cursor:pointer}
</style>
