.tm-fl::after{right:-1px}
.tm-am{color:#18130C;background:linear-gradient(180deg,#F7BC56 0%,#EFA63B 49.3%,#6E450F 49.4%,#6E450F 50.8%,#E39B31 50.9%,#D78F29 100%)}

.tm-pulse{animation:tmPulse 1.4s ease-in-out infinite}
