<style>
body{margin:0}
@keyframes drBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.6px)}}
@keyframes drTw{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes drSpin{to{transform:rotate(360deg)}}
@keyframes drBreath{0%,100%{opacity:.75}50%{opacity:1}}
.dr-bob{animation:drBob 4.2s ease-in-out infinite}
.dr-tw{animation:drTw 3.6s ease-in-out infinite}
.dr-spin{animation:drSpin 40s linear infinite;transform-origin:50% 50%}
.dr-breath{animation:drBreath 2.8s ease-in-out infinite}
.dr-num{font-family:'Jost',sans-serif;font-weight:600;color:#FFFFFF;line-height:1;text-shadow:0 0 1px #2A2348,0 2px 0 rgba(42,35,72,.85),0 0 10px rgba(42,35,72,.55),0 0 18px rgba(255,214,226,.55)}
.dr-pill{position:absolute;display:flex;align-items:center;border:1px solid rgba(255,255,255,.28);background:rgba(34,29,62,.72);color:#FFFFFF;border-radius:999px}
.dr-btn{position:absolute;bottom:4px;height:22px;padding:0 14px;border:1px solid rgba(255,255,255,.34);border-radius:999px;background:rgba(30,26,56,.66);color:#FFFFFF;font:700 12px/20px 'Gothic A1',sans-serif;letter-spacing:.12em;cursor:pointer}
</style>
