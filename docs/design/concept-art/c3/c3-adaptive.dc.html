</head>
<body>
<x-dc>
<helmet>

.ad-dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex:none}
.ad-btn{position:absolute;top:818px;height:22px;border:0;padding:0;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #5C6066; font-family: 'Noto Sans KR', sans-serif; color: #F4F5F6">

  <linearGradient id="adSoftX" x1="0" y1="0" x2="1" y2="0">

  </linearGradient>
  <mask id="adMaskX" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
    <rect x="-20" y="0" width="68.6" height="844" fill="url(#adSoftX)"/>
    <rect x="48.6" y="0" width="36.6" height="844" fill="url(#adSoftX)"/>
    <rect x="85.2" y="0" width="36.6" height="844" fill="url(#adSoftX)"/>
    <rect x="121.8" y="0" width="36.6" height="844" fill="url(#adSoftX)"/>
    <rect x="158.4" y="0" width="36.6" height="844" fill="url(#adSoftX)"/>
    <rect x="195" y="0" width="36.6" height="844" fill="url(#adSoftX)"/>
    <rect x="231.6" y="0" width="73.2" height="844" fill="url(#adSoftX)"/>
    <rect x="304.8" y="0" width="36.6" height="844" fill="url(#adSoftX)"/>
    <rect x="341.4" y="0" width="68.6" height="844" fill="url(#adSoftX)"/>
  </mask>
  <filter id="adSoftEdge" x="-10%" y="0" width="120%" height="100%"><feGaussianBlur stdDeviation="6 0"/></filter>
  <!-- 세계마다 옅은 결 -->

  <pattern id="adPTopo" patternUnits="userSpaceOnUse" x="231.6" width="73.2" height="44">

  <filter id="adB2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>

  <!-- 무기 공통 처리: 같은 색 보정 · 왼쪽 위 테두리광 · 오른쪽 아래 그늘 · 같은 그림자 -->

    <feColorMatrix in="SourceGraphic" type="saturate" values=".82" result="g"/>
    <feOffset in="SourceAlpha" dx="1.2" dy="1.2" result="o1"/>
    <feComposite in="SourceAlpha" in2="o1" operator="out" result="rimA"/>
    <feFlood flood-color="#FFF6E6" flood-opacity=".9"/><feComposite in2="rimA" operator="in" result="rim"/>
    <feOffset in="SourceAlpha" dx="-1.3" dy="-1.3" result="o2"/>
    <feComposite in="SourceAlpha" in2="o2" operator="out" result="drkA"/>
    <feFlood flood-color="#0C0D10" flood-opacity=".5"/><feComposite in2="drkA" operator="in" result="drk"/>
    <feOffset in="SourceAlpha" dx="4" dy="3" result="o3"/><feGaussianBlur in="o3" stdDeviation="2" result="b3"/>
    <feColorMatrix in="b3" type="matrix" values="0 0 0 0 .05  0 0 0 0 .05  0 0 0 0 .07  0 0 0 .42 0" result="cast"/>
    <feMerge><feMergeNode in="cast"/><feMergeNode in="g"/><feMergeNode in="drk"/><feMergeNode in="rim"/></feMerge>
  </filter>
  <radialGradient id="adPool" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>

  <linearGradient id="adPedTop" x1="0" y1="0" x2="1" y2="1">

    <path d="M8.6,0 L4.3,7.45 L-4.3,7.45 L-8.6,0 L-4.3,-7.45 L4.3,-7.45 Z" fill="none" stroke="#FF3B5C" stroke-width="1.1" stroke-linejoin="round"/>

  </radialGradient>
  <g id="adBlast">
    <circle cx="0" cy="0" r="50" fill="url(#adGlowO)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#FF8A2A" stroke-width="1.4" opacity=".7"/>
    <circle cx="0" cy="0" r="29" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity=".8"/>
    <path d="M4.8,-1.6 L34.3,-3.3 L5.0,0.6 Z M4.9,1.2 L30.0,14.7 L3.9,3.1 Z M3.6,3.5 L15.1,22.8 L1.8,4.7 Z M2.0,4.6 L4.7,23.7 L-0.1,5.0 Z M-1.7,4.7 L-15.2,23.8 L-3.5,3.5 Z M-3.1,4.0 L-25.0,20.8 L-4.4,2.3 Z M-4.8,1.4 L-33.9,2.5 L-4.9,-0.7 Z M-5.0,-0.6 L-28.9,-10.5 L-4.2,-2.7 Z M-3.4,-3.7 L-14.2,-24.4 L-1.5,-4.8 Z M-1.8,-4.7 L-3.9,-26.3 L0.4,-5.0 Z M0.8,-4.9 L11.6,-29.4 L2.8,-4.1 Z M3.8,-3.3 L29.1,-15.9 L4.8,-1.4 Z" fill="#FFFFFF"/>

  <!-- ===== 무기 10개 (원점 = 받침 윗면 가운데, 위로 약 50) ===== -->

    </g>
    <rect x="-1" y="-20" width="6" height="5" rx="1" fill="#30342A"/>
    <g transform="translate(1,-22) rotate(-74) scale(.8)">
      <path d="M-27,-1.5 L-12,-3.8 L-12,3.2 L-17,3.2 L-25,7.5 L-28,6.5 Z" fill="#59603F"/>
      <path d="M-27,-1.5 L-12,-3.8 L-12,-1.6 L-26.5,.4 Z" fill="#858E63"/>
      <rect x="-14" y="-2.6" width="3" height="4.6" fill="#232527"/>
      <path d="M-11,-5.2 L10,-5.2 L10,2.4 L-11,2.4 Z" fill="#646B4A"/>
      <path d="M-11,-5.2 L10,-5.2 L10,-3.2 L-11,-3.2 Z" fill="#7E865F"/>
