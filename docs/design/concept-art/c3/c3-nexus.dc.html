</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&amp;family=IBM+Plex+Sans+KR:wght@300;500;700&amp;display=swap">
<style>
body{margin:0}
@keyframes nxSweep{0%{transform:translateX(-90px) skewX(-18deg)}55%,100%{transform:translateX(400px) skewX(-18deg)}}
@keyframes nxBreath{0%,100%{opacity:.85}50%{opacity:1}}
.nx-sweep{animation:nxSweep 3.2s ease-in-out infinite}
.nx-tear{animation:nxBreath 2.4s ease-in-out infinite}
.nx-num{font-family:'IBM Plex Sans KR',sans-serif;font-weight:700;color:#1C1B1F;line-height:1;letter-spacing:-.02em;text-shadow:-1.5px -1.5px 0 #F4F1EB,1.5px -1.5px 0 #F4F1EB,-1.5px 1.5px 0 #F4F1EB,1.5px 1.5px 0 #F4F1EB,0 1.5px 0 #F4F1EB,0 -1.5px 0 #F4F1EB,1.5px 0 0 #F4F1EB,-1.5px 0 0 #F4F1EB}
.nx-btn{position:absolute;bottom:4px;height:25px;padding:0 14px;border:0;border-radius:2px;background:#D9D5CD;color:#1C1B1F;font:500 12px/25px 'IBM Plex Sans KR',sans-serif;letter-spacing:.08em;cursor:pointer}
</style>
</helmet>
